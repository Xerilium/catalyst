# @req FR:pull-request-workflow/lifecycle.@command
name: pr
description: |
  Reconcile a pull request: set its lifecycle labels and assignees from its
  live state, then squash-merge it when it is an Autopilot PR that meets every
  merge rule. Runs as a script with no AI judgment.

owner: Engineer

inputs:
  - number: pr-number
    description: GitHub PR number to reconcile
    required: true

steps:
  - playbook: reconcile-pull-request
    inputs:
      pr-number: "{{pr-number}}"

  - playbook: merge-pull-request
    inputs:
      pr-number: "{{pr-number}}"
