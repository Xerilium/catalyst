name: init
description: |
  Initialize Catalyst in your project. Removes AI command files generated by
  earlier Catalyst versions and shows how to add the Catalyst plugin to your
  AI tool. Run this once after installing the @xerilium/catalyst package.

owner: Engineer

# @req FR:cli-init/init.@command
# @req FR:cli-init/init.@playbook
# @req FR:cli-init/init.idempotent
steps:
  - display: "🧹 Removing command files generated by earlier Catalyst versions..."

  # @req FR:cli-init/init.legacy
  - playbook: remove-legacy-commands

  # @req FR:cli-init/init.positioning
  # @req FR:cli-init/init.handoff
  # TODO: Change the command references to be in a different color so they are more visible in the output
  - display: |

      ✓ Catalyst initialized.

      Next: Add the Catalyst plugin to your AI tool, then run /catalyst:init to set up your product context.

        Claude Code:  /plugin marketplace add xerilium/ai-plugins
                      /plugin install catalyst@xerilium
        Other agents: https://github.com/xerilium/catalyst#install
