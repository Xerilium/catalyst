name: init
description: |
  Deprecated in favor of the Catalyst plugin, which provides the /catalyst:*
  workflows. Removes AI command files generated by earlier Catalyst versions
  and shows how to add the plugin to your AI tool. Run this once after
  installing the @xerilium/catalyst package.

owner: Engineer

# @req FR:cli-init/init.@command
# @req FR:cli-init/init.@playbook
# @req FR:cli-init/init.idempotent
steps:
  - display: "🧹 Removing command files generated by earlier Catalyst versions..."

  # @req FR:cli-init/init.legacy
  - playbook: remove-legacy-commands

  # @req FR:cli-init/init.deprecated
  # @req FR:cli-init/init.handoff
  # TODO: Change the command references to be in a different color so they are more visible in the output
  - display: |

      ✓ Cleanup complete.

      Catalyst init is deprecated in favor of the Catalyst plugin, which now provides the /catalyst:* workflows. It only removes command files generated by earlier Catalyst versions.

      Next: Add the Catalyst plugin to your AI tool, then run /catalyst:init to set up your product context.

        Claude Code:  /plugin marketplace add xerilium/catalyst
                      /plugin install catalyst@xerilium
        Other agents: https://github.com/xerilium/catalyst#install
