name: init
description: |
  Initialize Catalyst in this project. Runs install-time setup (removes AI
  command files generated by earlier Catalyst versions; the Catalyst plugin
  now provides the /catalyst:* workflows) and shows how to add the plugin to
  your AI tool. Run this once after installing the @xerilium/catalyst package.

owner: Engineer

# @req FR:cli-init/init.@command
# @req FR:cli-init/init.@playbook
# @req FR:cli-init/init.idempotent
steps:
  - display: "🚀 Initializing Catalyst..."

  # Capture project root (consumer's cwd at invocation time).
  # script action sets __dirname to cwd; this is the consumer's project root.
  - name: project-root
    script: |
      return __dirname;

  # @req FR:cli-init/init.ai-plugin
  - name: install-result
    playbook: install-ai-plugin
    inputs:
      project-root: "{{project-root}}"

  # @req FR:cli-init/init.handoff
  # TODO: Change the command references to be in a different color so they are more visible in the output
  - display: |

      ✓ Catalyst initialized.

      Next: add the Catalyst plugin to your AI tool, then run /catalyst:init to set up your product context.

        Claude Code:  /plugin marketplace add xerilium/catalyst
                      /plugin install catalyst@xerilium
        Other agents: https://github.com/xerilium/catalyst#install
