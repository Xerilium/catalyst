name: init
description: |
  Initialize Catalyst in your project. Removes AI command files generated by
  earlier Catalyst versions, detects which AI coding platforms this project
  uses, and shows how to add the Catalyst plugin to the one you pick. Run this
  once after installing the @xerilium/catalyst package.

owner: Engineer

# @req FR:cli-init/init.@command
# @req FR:cli-init/init.@playbook
# @req FR:cli-init/init.idempotent

# @req FR:cli-init/init.platform.parameter
inputs:
  - string: platform
    description: AI platform to set up, skipping the prompt
    required: false
    allowed: [claude-code, cursor, copilot, other, all]

steps:
  - display: "🧹 Removing command files generated by earlier Catalyst versions..."

  # @req FR:cli-init/init.legacy
  - playbook: remove-legacy-commands

  # ------------------------------------------------------------------
  # Which platforms does this project already use? Markers are the same
  # directories earlier Catalyst versions generated commands into, so the
  # detection and the cleanup above stay in step.
  # @req FR:cli-init/init.platform.detect
  # @req FR:cli-init/init.platform.detect.markers
  # ------------------------------------------------------------------
  - name: detect
    script: |
      const root = __dirname; // consumer project: the directory Catalyst runs in
      const has = (...rels) => rels.some((rel) => fs.existsSync(path.join(root, rel)));
      const platforms = [
        { key: 'claude-code', name: 'Claude Code', detected: has('.claude') },
        { key: 'cursor', name: 'Cursor', detected: has('.cursor') },
        { key: 'copilot', name: 'GitHub Copilot', detected: has('.github/copilot-instructions.md', '.github/prompts', '.vscode') },
      ];
      const found = platforms.filter((p) => p.detected);
      return {
        found: found.map((p) => p.key),
        // Pre-selects the detected platform; the user still has to confirm it
        suggested: found.length === 1 ? found[0].key : found.length > 1 ? 'all' : 'claude-code',
        summary: found.length > 0
          ? `Detected ${found.map((p) => p.name).join(' and ')} in this project.`
          : 'No AI platform detected in this project.',
      };

  # Say what was found whether or not we go on to prompt: without a TTY the
  # checkpoint auto-selects and never renders, and the user still needs to know
  # which platform the steps below are for.
  # @req FR:cli-init/init.platform.detect
  - display: "{{detect.summary}}"

  # ------------------------------------------------------------------
  # Ask unless --platform said. The detected platform is the default, but
  # nothing happens until the user confirms it.
  # @req FR:cli-init/init.platform.prompt
  # @req FR:cli-init/init.platform.prompt.confirm
  # ------------------------------------------------------------------
  - if: ${{ !get('platform') }}
    then:
      - name: pick
        checkpoint:
          header: "Catalyst plugin"
          message: "Which AI platform should I show setup steps for?"
          context: |
            Catalyst ships as a plugin for your AI coding tool. The plugin is
            separate from the @xerilium/catalyst package: the package holds the
            workflows and is pinned in your lockfile, and the plugin is the set
            of skills your AI tool loads.

            Nothing is installed or configured for you. Catalyst prints the
            exact steps for the platform you pick, so you decide what touches
            your editor's settings.
          options:
            - key: claude-code
              label: "&Claude Code"
              description: Install from the xerilium plugin marketplace
            - key: cursor
              label: "C&ursor"
              description: Load the Agent Plugins package
            - key: copilot
              label: "GitHub Cop&ilot / VS Code"
              description: Load the Agent Plugins package
            - key: other
              label: "&Other Agent Plugins client"
              description: Codex, Kiro, Antigravity, and anything else
            - key: all
              label: "&All of them"
              description: Show the steps for every platform
          default: "{{detect.suggested}}"

      # Branch step results are scoped to the branch, so lift the answer out
      - var: chosen
        value: "{{pick.selected}}"
    else:
      - var: chosen
        value: "{{platform}}"

  # ------------------------------------------------------------------
  # Print the steps. Catalyst never writes to a platform's configuration —
  # see the design decision on this in .xe/features/cli-init/.
  # @req FR:cli-init/init.platform.steps
  # @req FR:cli-init/init.platform.steps.no-write
  # @req FR:cli-init/init.handoff
  # ------------------------------------------------------------------
  - name: instructions
    script: |
      const chosen = get('chosen') || 'claude-code';
      const order = ['claude-code', 'cursor', 'copilot', 'other'];
      const selected = chosen === 'all' ? order : [chosen];

      const AGENT_PLUGIN = 'node_modules/@xerilium/catalyst/agent-plugin';
      const steps = {
        'claude-code': [
          'Claude Code',
          '  In your shell:',
          '    claude plugin marketplace add xerilium/ai-plugins',
          '    claude plugin install catalyst@xerilium',
          '',
          '  Or in a Claude Code session:',
          '    /plugin marketplace add xerilium/ai-plugins',
          '    /plugin install catalyst@xerilium',
        ],
        cursor: [
          'Cursor',
          `  Load the Agent Plugins package at:`,
          `    ${AGENT_PLUGIN}`,
          '',
          '  Cursor also reads skills from .cursor/skills/ and .claude/skills/.',
        ],
        copilot: [
          'GitHub Copilot / VS Code',
          `  Add this path to the VS Code "chat.pluginLocations" setting:`,
          `    ${AGENT_PLUGIN}`,
        ],
        other: [
          'Other Agent Plugins clients (Codex, Kiro, Antigravity, …)',
          `  Load the Agent Plugins package at:`,
          `    ${AGENT_PLUGIN}`,
          '',
          '  See https://agent-plugins.org and https://github.com/xerilium/catalyst#install',
        ],
      };

      const lines = ['', '✓ Catalyst initialized.', ''];
      lines.push(selected.length > 1 ? 'Next: add the Catalyst plugin to your AI tool.' : 'Next: add the Catalyst plugin.');
      for (const key of selected) {
        lines.push('', ...steps[key]);
      }
      lines.push('', 'Then run /catalyst:init (/catalyst-init outside Claude Code) to set up your product context.');
      return { text: lines.join('\n'), selected };

  - display: "{{instructions.text}}"
