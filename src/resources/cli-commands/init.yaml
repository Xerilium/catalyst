name: init
description: |
  Initialize Catalyst in your project. Removes AI command files generated by
  earlier Catalyst versions, detects which AI coding platforms this project
  uses, and sets up the Catalyst plugin in the ones you pick — or shows you
  the steps, if you'd rather run them yourself. Run this once after installing
  the @xerilium/catalyst package.

owner: Engineer

# @req FR:cli-init/init.@command
# @req FR:cli-init/init.@playbook
# @req FR:cli-init/init.idempotent

# @req FR:cli-init/init.platform.parameter
# @req FR:cli-init/init.platform.mode.parameter
inputs:
  - string: platform
    description: AI platforms to set up, comma-separated (claude, cursor, copilot, other), skipping the prompt
    required: false
  - string: setup
    description: auto runs the setup for you; manual shows the steps instead
    required: false
    allowed: [auto, manual]

steps:
  - display: "🧹 Removing command files generated by earlier Catalyst versions..."

  # @req FR:cli-init/init.legacy
  - playbook: remove-legacy-commands

  # @req FR:cli-init/init.platform.detect
  - name: detect
    playbook: detect-ai-platforms

  # Say what was found even when we don't prompt: without a TTY the checkpoint
  # auto-selects and never renders.
  - display: "{{detect.summary}}"

  # Defined up here so the branches below can set them
  - var: chosen
    value: "{{platform}}"
  - var: mode
    value: "{{setup}}"

  # ------------------------------------------------------------------
  # Ask unless --platform said. Detected platforms are pre-checked.
  # @req FR:cli-init/init.platform.prompt
  # ------------------------------------------------------------------
  - if: ${{ !get('platform') }}
    then:
      - name: pick
        checkpoint:
          header: "Catalyst plugin"
          message: "Which AI platforms would you like to set up?"
          context: |
            Catalyst ships as a plugin for your AI coding tool. The plugin is
            separate from the @xerilium/catalyst package: the package holds the
            workflows and is pinned in your lockfile, and the plugin is the set
            of skills your AI tool loads.

            Pick every platform your team uses. Next you choose whether
            Catalyst sets them up for you or shows you the steps.
          multiSelect: true
          options:
            - key: claude
              label: "&Claude Code"
              description: Install from the xerilium plugin marketplace, for this project
            - key: cursor
              label: "C&ursor"
              description: Load the Agent Plugins package
            - key: copilot
              label: "&GitHub Copilot"
              description: Add the plugin to this project's VS Code settings
            - key: other
              label: "&Other Agent Plugins client"
              description: Codex, Kiro, Antigravity, and anything else
          default: "{{detect.suggested}}"
      - var: chosen
        value: "{{pick.selected}}"

  # @req FR:cli-init/init.platform.mode
  - if: ${{ !get('setup') && !!get('chosen') }}
    then:
      - name: how
        checkpoint:
          header: "Catalyst plugin"
          message: "Should I set it up for you?"
          options:
            - key: auto
              label: "&Yes, set it up"
              description: Runs the install commands and edits project settings where the platform supports it
            - key: manual
              label: "&No, show me the steps"
              description: Prints the exact commands so you can run them yourself
          default: auto
      - var: mode
        value: "{{how.selected}}"

  # @req FR:cli-init/init.platform.parameter
  - name: parsed
    script: |
      const raw = get('chosen');
      const keys = (Array.isArray(raw) ? raw : String(raw || '').split(','))
        .map((k) => String(k).trim()).filter(Boolean);
      return { keys, unknown: keys.filter((k) => !['claude', 'cursor', 'copilot', 'other'].includes(k)).join(', ') };
  - var: selected
    value: "${{ get('parsed').keys }}"
  - if: ${{ !!get('parsed').unknown }}
    then:
      - throw:
          code: UnknownPlatform
          message: "Unknown platform: {{parsed.unknown}}. Use claude, cursor, copilot, or other."

  - if: ${{ get('selected').length === 0 }}
    then:
      - display: "No platform selected. Run catalyst init again to set one up."

  - var: auto
    value: ${{ get('mode') !== 'manual' }}

  # ------------------------------------------------------------------
  # Set up, or show the steps for, each chosen platform.
  # @req FR:cli-init/init.platform.setup
  # @req FR:cli-init/init.platform.steps
  # ------------------------------------------------------------------
  - for-each: key
    in: "{{selected}}"
    steps:
      - if: ${{ get('key') === 'claude' }}
        then:
          - playbook: setup-claude-plugin
            inputs:
              auto: "{{auto}}"

      - if: ${{ get('key') === 'copilot' }}
        then:
          - playbook: setup-copilot-plugin
            inputs:
              auto: "{{auto}}"

      # Neither has a command or project setting Catalyst can drive, so these
      # stay manual either way
      - if: ${{ get('key') === 'cursor' }}
        then:
          - display: |

              Cursor
                Load the Agent Plugins package at:
                  node_modules/@xerilium/catalyst/agent-plugin

                Cursor also reads skills from .cursor/skills/ and .claude/skills/.

      - if: ${{ get('key') === 'other' }}
        then:
          - display: |

              Other Agent Plugins clients (Codex, Kiro, Antigravity, …)
                Load the Agent Plugins package at:
                  node_modules/@xerilium/catalyst/agent-plugin

                See https://agent-plugins.org and https://github.com/xerilium/catalyst#install

  # @req FR:cli-init/init.labels
  - playbook: sync-repo-labels

  # @req FR:cli-init/init.handoff
  - display: |

      ✓ Catalyst initialized.
      Next: run /catalyst:init (/catalyst-init outside Claude Code) to set up your product context.
