# Catalyst PR: runs `catalyst pr` on every PR event, so labels and assignees stay
# current and an Autopilot PR merges once it meets every merge gate. A held PR
# runs again when its checks finish. A fork PR is never re-run and its approval never merges,
# since GitHub lists no PR on a fork PR's check suite or workflow run. A CI that reports only
# through the commit status API (no check run) does not re-run a held PR.
#
# Merging is opt in. GITHUB_TOKEN has no signed-in user, so with it Catalyst
# updates labels and assignees and never merges. To let Autopilot merge, add a
# repository secret named CATALYST_TOKEN: a token for the user who opens the
# repository's PRs, with `repo` scope (classic) or Contents, Pull requests,
# Issues write and Checks, Commit statuses read (fine-grained).
#
# This workflow never adds the Autopilot label; the PR author does, with the
# label or an `#autopilot` comment.
#
# Requires a Node project (npm, pnpm, Yarn, or Bun lockfile) with @xerilium/catalyst as a
# dependency. `catalyst init` copies this file to .github/workflows and never overwrites it,
# so edit the copy to fit your repository (Node version, timeout, steps). A project that installed
# an older copy picks up newer triggers by replacing .github/workflows/catalyst-pr.yml with
# node_modules/@xerilium/catalyst/templates/workflows/catalyst-pr.yml, then re-applying its edits.
#
# To use another runner (self-hosted, a different OS), set the repository variable
# CATALYST_RUNS_ON to a JSON runner label or array, e.g. "windows-latest" or ["self-hosted","linux"].
# @req FR:pull-request-workflow/reconcile.@gh-action
name: Catalyst PR

# `pull_request_target` and `issue_comment` run the default branch's copy of this file, so a PR
# can't change what they do with CATALYST_TOKEN. Review events run the PR's own copy, so they
# get only GITHUB_TOKEN. Anyone who can push a branch to the repository can still write a
# workflow that reads any repository secret; fork PRs get no secrets.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, labeled, unlabeled]
  pull_request_review:
  pull_request_review_comment:
  pull_request_review_thread:
  issue_comment:
  # @req FR:pull-request-workflow/reconcile.rerun
  check_suite:
    types: [completed]
  # `workflows` is required; '*' matches every workflow, and the job `if` skips what has no PR
  workflow_run:
    workflows: ['*']
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: write
  # Write: Catalyst writes the Threads resolved and Codeowner approved check runs
  # @req FR:pull-request-workflow/reconcile.check-runs.permission
  checks: write
  statuses: read
  actions: read

# One run per PR at a time; GitHub keeps the latest waiting run, which sees the newest state
concurrency:
  # A run the job skips gets its own group, so it can't take the queue slot of a real run
  # @req FR:pull-request-workflow/reconcile.rerun.group
  group: >-
    catalyst-pr-${{ (
      startsWith(github.event.comment.body, '🤖 [AI]') || startsWith(github.event.comment.body, '⚛️ [Catalyst]')
      || (github.event_name == 'issue_comment' && !github.event.issue.pull_request)
      || (github.event_name == 'check_suite' && github.event.check_suite.app.slug == 'github-actions')
      || (github.event_name == 'workflow_run' && github.event.workflow_run.name == github.workflow && !startsWith(github.event.workflow_run.event, 'pull_request_review'))
      || github.event.check_suite.pull_requests[1] || github.event.workflow_run.pull_requests[1]
    ) && github.run_id || github.event.pull_request.number || github.event.issue.number || github.event.check_suite.pull_requests[0].number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile
    runs-on: ${{ fromJSON(vars.CATALYST_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 30
    # Skip what would loop or has no single PR: check suites that name none or several PRs, check
    # suites GitHub Actions created (GitHub starts no workflow for those, so Actions checks are
    # covered by `workflow_run`), runs of this workflow (except the follow-up to a review run),
    # and our own comments or non-PR comments
    # @req FR:pull-request-workflow/reconcile.rerun.no-loop
    if: >-
      (github.event_name != 'check_suite' || (github.event.check_suite.app.slug != 'github-actions'
        && github.event.check_suite.pull_requests[0] && !github.event.check_suite.pull_requests[1]))
      && (github.event_name != 'workflow_run' || ((github.event.workflow_run.name != github.workflow
        || startsWith(github.event.workflow_run.event, 'pull_request_review'))
        && github.event.workflow_run.pull_requests[0] && !github.event.workflow_run.pull_requests[1]))
      && (github.event_name != 'issue_comment' || (github.event.issue.pull_request
        && !startsWith(github.event.comment.body, '🤖 [AI]')
        && !startsWith(github.event.comment.body, '⚛️ [Catalyst]')))
    env:
      GH_REPO: ${{ github.repository }}
      EVENT_PATH: ${{ github.event_path }}
    steps:
      # The PR number, from whichever event this is. A check suite or workflow run of a fork PR
      # names none, and one for several PRs is ambiguous, so both are skipped.
      # @req FR:pull-request-workflow/reconcile.rerun.number
      - name: Find the PR
        id: pr
        run: |
          number=$(jq -r '
            (.pull_request.number // (if .issue.pull_request then .issue.number else empty end)
              // (((.check_suite // .workflow_run).pull_requests // []) | if length == 1 then .[0].number else empty end))
            // empty' "$EVENT_PATH")
          if [ -z "$number" ]; then echo "No PR for this event; nothing to do."; fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # The default branch, never PR code
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.pr.outputs.number
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.pr.outputs.number
        with:
          node-version: '22'

      # Installs with the package manager whose lockfile the project commits
      - name: Install dependencies
        if: steps.pr.outputs.number
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable pnpm && pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            corepack enable yarn
            if [ -f .yarnrc.yml ]; then yarn install --immutable; else yarn install --frozen-lockfile; fi
          elif [ -f bun.lock ] || [ -f bun.lockb ]; then
            npm install --global bun && bun install --frozen-lockfile
          else
            npm ci
          fi

      # Fetch the PR head as a ref only, so Autopilot can test it in a worktree
      - name: Fetch the PR head
        if: steps.pr.outputs.number
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          GH_TOKEN: ${{ github.token }}
        run: git -c credential.helper='!gh auth git-credential' fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"

      # A failure fails the job; Autopilot merges only a PR that passes every gate
      - name: Reconcile
        if: steps.pr.outputs.number
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          # Only this step holds the merge token. Review events run PR code from the PR's own
          # workflow file, so they never see the secret.
          GH_TOKEN: ${{ startsWith(github.event_name, 'pull_request_review') && github.token || secrets.CATALYST_TOKEN || github.token }}
          # Only GITHUB_TOKEN can write check runs; the merge token is a user token
          CATALYST_CHECKS_TOKEN: ${{ github.token }}
        run: npx catalyst pr "${PR_NUMBER}"

      # The diagnostics log, even when the reconcile failed
      # @req FR:pull-request-workflow/reconcile.diagnostics.summary
      - name: Diagnostics
        if: always() && steps.pr.outputs.number
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          log=".xe/runs/pr-${PR_NUMBER}.md"
          if [ -f "$log" ]; then cat "$log" >> "$GITHUB_STEP_SUMMARY"; fi
