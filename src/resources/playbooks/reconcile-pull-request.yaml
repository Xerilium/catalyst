# @req FR:pull-request-workflow/lifecycle.@playbook
# @req FR:pull-request-workflow/lifecycle.independent
name: reconcile-pull-request
description: Set a pull request's lifecycle labels and assignees from its live state, so the labels show where the PR stands and the assignees show who acts next. Needs only the PR number.
owner: Engineer

# @req FR:pull-request-workflow/lifecycle.input
inputs:
  - number: pr-number
    description: GitHub PR number to reconcile
    required: true

steps:
  # @req FR:pull-request-workflow/lifecycle.labels
  - name: labels
    playbook: resolve-pull-request-labels

  # Never create labels: a label missing from the repository is skipped
  - name: repo-labels
    github-label-list:

  # @req FR:pull-request-workflow/lifecycle.needs-attention.threads
  - name: pr
    github-pr-get: "{{pr-number}}"

  # What each label and assignee should be, from the PR's state alone
  # @req FR:pull-request-workflow/lifecycle.paused
  # @req FR:pull-request-workflow/lifecycle.draft
  # @req FR:pull-request-workflow/lifecycle.needs-attention
  # @req FR:pull-request-workflow/lifecycle.needs-attention.no-conflict
  # @req FR:pull-request-workflow/lifecycle.needs-review
  # @req FR:pull-request-workflow/lifecycle.ready
  # @req FR:pull-request-workflow/lifecycle.assignment
  # @req FR:pull-request-workflow/lifecycle.finalized-stale
  # @req FR:pull-request-workflow/lifecycle.finalized-stale.no-add
  # @req FR:pull-request-workflow/lifecycle.idempotent
  - name: plan
    script: |
      const pr = get('pr');
      const { names, aliases } = get('labels');
      const present = get('repo-labels').map((l) => l.name);
      const lower = (s) => String(s).toLowerCase();
      const uniq = (a) => [...new Set(a)];
      const nothing = { addLabels: [], removeLabels: [], addAssignees: [], removeAssignees: [] };

      // The spelling of a label on this PR, if it carries it
      const onPR = (id) => pr.labels.find((l) => l === names[id] || (aliases[id] || []).includes(l));

      // A paused PR is left exactly as it is
      if (onPR('paused')) {
        return { ...nothing, summary: 'paused; nothing to change' };
      }

      const author = lower(pr.author);
      const isAuthor = (login) => lower(login) === author;
      const humans = pr.reviews.filter((r) => !r.bot);
      const approvers = pr.reviews.filter((r) => r.state === 'APPROVED').map((r) => lower(r.author));

      // A merge conflict alone never needs attention
      const needsAttention =
        !pr.isDraft &&
        (pr.threads.some((t) => {
          if (t.resolved) { return false; }
          const last = t.comments[t.comments.length - 1];
          return !last || !isAuthor(last.author) || t.comments.every((c) => isAuthor(c.author)) || last.body.includes('🧭');
        }) || pr.checks.some((c) => c.state === 'fail'));
      const ready =
        !pr.isDraft &&
        humans.some((r) => r.state === 'APPROVED') &&
        !humans.some((r) => r.state === 'CHANGES_REQUESTED');

      const want = pr.isDraft
        ? { 'needs-review': false, 'needs-attention': false, ready: false, finalized: false }
        : { 'needs-attention': needsAttention, ready, 'needs-review': !needsAttention && !ready };

      // Finalized is removed when stale, never added; only the sweep adds it
      const certified = pr.comments
        .map((c) => /☑️ Finalized at ([0-9a-f]{7,40})/i.exec(c.body)?.[1])
        .filter(Boolean)
        .pop();
      const current = certified !== undefined && lower(pr.headSha).startsWith(lower(certified));
      if (pr.isDraft || needsAttention || (pr.codeOwned && !ready) || !current) {
        want.finalized = false;
      }

      const addLabels = [];
      const removeLabels = [];
      for (const [id, on] of Object.entries(want)) {
        const has = onPR(id);
        if (on && !has && present.includes(names[id])) {
          addLabels.push(names[id]);
        } else if (!on && has) {
          removeLabels.push(has);
        }
      }

      // Whoever acts next; a Blocked PR keeps its assignees
      const owners = pr.codeOwners.filter((o) => !approvers.includes(lower(o)));
      let assign;
      if (pr.isDraft || needsAttention) {
        assign = [pr.author];
      } else if (ready) {
        assign = uniq([pr.author, ...owners]);
      } else if (!onPR('blocked')) {
        assign = uniq(owners);
      }
      let addAssignees = [];
      let removeAssignees = [];
      if (assign) {
        const have = pr.assignees.map(lower);
        const wanted = assign.map(lower);
        addAssignees = assign.filter((a) => !have.includes(lower(a)));
        removeAssignees = pr.assignees.filter((a) => !wanted.includes(lower(a)));
      }

      return {
        addLabels, removeLabels, addAssignees, removeAssignees,
        summary: `+${addLabels.length} / -${removeLabels.length} labels, +${addAssignees.length} / -${removeAssignees.length} assignees`,
      };

  # No change makes no call, so running again on an unchanged PR changes nothing
  - github-pr-edit: "{{pr-number}}"
    addLabels: "{{plan.addLabels}}"
    removeLabels: "{{plan.removeLabels}}"
    addAssignees: "{{plan.addAssignees}}"
    removeAssignees: "{{plan.removeAssignees}}"

  - display: "PR {{pr-number}}: {{plan.summary}}"
