# @req FR:repo-labels/sync.@playbook
name: sync-repo-labels
description: Create, rename, and clean up the repository's standard issue, PR, and discussion labels, following the naming style the repository already uses.
owner: Engineer

# @req FR:repo-labels/sync.input
inputs:
  - string: style
    description: Naming style, skipping the question (key-value, simple, or custom)
    required: false
    allowed: [key-value, simple, custom]

steps:
  - var: available
    value: false

  # ------------------------------------------------------------------
  # Read every label with how many issues and PRs carry it
  # @req FR:repo-labels/sync.unavailable
  # @req FR:repo-labels/sync.portable
  # ------------------------------------------------------------------
  - try:
      - name: labels
        github-label-list:
      - var: available
        value: true
    catch:
      - code: GitHubLabelListAuthenticationFailed
        steps:
          - display: "\n⚠️  Labels: skipped. Sign in with `gh auth login`, then run `catalyst run sync-repo-labels`."
      - code: "*"
        steps:
          - display: "\n⚠️  Labels: skipped. {{$error.message}}. Run `catalyst run sync-repo-labels` once that is resolved."

  # @req FR:repo-labels/sync.catalog
  # @req FR:repo-labels/catalog.name
  # @req FR:repo-labels/catalog.emoji
  # @req FR:repo-labels/catalog.emoji.status
  # @req FR:repo-labels/catalog.emoji.other
  # @req FR:repo-labels/catalog.emoji.resolution
  # @req FR:repo-labels/catalog.color
  # @req FR:repo-labels/catalog.color.urgent
  # @req FR:repo-labels/catalog.color.waiting
  # @req FR:repo-labels/catalog.color.welcome
  # @req FR:repo-labels/catalog.color.release
  # @req FR:repo-labels/catalog.color.state
  # @req FR:repo-labels/catalog.color.neutral
  # @req FR:repo-labels/catalog.external
  # @req FR:repo-labels/catalog.breaking-change
  # @req FR:repo-labels/catalog.good-first-issue
  # @req FR:repo-labels/catalog.help-wanted
  # @req FR:repo-labels/catalog.hotfix
  # @req FR:repo-labels/catalog.needs-attention
  # @req FR:repo-labels/catalog.needs-live-test
  # @req FR:repo-labels/catalog.needs-review
  # @req FR:repo-labels/catalog.needs-triage
  # @req FR:repo-labels/catalog.release-blocker
  # @req FR:repo-labels/catalog.release-priority
  # @req FR:repo-labels/catalog.release-stretch
  # @req FR:repo-labels/catalog.cant-repro
  # @req FR:repo-labels/catalog.duplicate
  # @req FR:repo-labels/catalog.external
  # @req FR:repo-labels/catalog.invalid
  # @req FR:repo-labels/catalog.no-activity
  # @req FR:repo-labels/catalog.wont-fix
  # @req FR:repo-labels/catalog.autopilot
  # @req FR:repo-labels/catalog.blocked
  # @req FR:repo-labels/catalog.finalized
  # @req FR:repo-labels/catalog.paused
  # @req FR:repo-labels/catalog.ready
  # @req FR:repo-labels/catalog.wip
  # @req FR:repo-labels/sync.discover
  # @req FR:repo-labels/sync.discover.defaults
  # @req FR:repo-labels/sync.discover.none
  # @req FR:repo-labels/sync.rename.defaults
  # @req FR:repo-labels/sync.rename.emoji
  # @req FR:repo-labels/sync.config.override
  # @req FR:repo-labels/sync.rename
  # @req FR:repo-labels/sync.config
  # @req FR:repo-labels/sync.color
  # @req FR:repo-labels/sync.merge
  - name: analysis
    script: |
      const none = { ops: [], summary: '', config: null, configText: '' };
      const noExtras = { extras: [], extrasSummary: '' };
      if (!get('available')) {
        return { ...noExtras, savedStyle: 'key-value', differing: [], plans: { 'key-value': { standard: none, keep: none } } };
      }

      // Catalog: keep in sync with FR:repo-labels/sync.catalog
      const C = (id, group, value, emoji, simple, color, description, aliases = []) =>
        ({ id, group, value, emoji, simple, color, description, aliases });
      const catalog = [
        C('breaking-change', null, 'Breaking change', '🚨', 'breaking change', 'B60205', 'Breaks existing behavior; requires a major version'),
        C('good-first-issue', null, 'Good first issue', '🏆', 'good first issue', '5319E7', 'Approachable for newcomers'),
        C('help-wanted', null, 'Help wanted', '✨', 'help wanted', '5319E7', 'Outside contributions welcome'),
        C('hotfix', null, 'Hotfix', '🔥', 'hotfix', 'B60205', 'Urgent fix that ships as soon as it merges'),
        C('needs-attention', 'Needs', 'Attention', '👋', 'needs attention', 'B60205', 'Author or reporter action required'),
        C('needs-live-test', 'Needs', 'Live test', '🔬', 'needs live test', '000000', 'Needs a manual test in a live environment before merge'),
        C('needs-review', 'Needs', 'Review', '👀', 'needs review', 'FBCA04', 'Waiting on a reviewer'),
        C('needs-triage', 'Needs', 'Triage', '🔍', 'needs triage', 'FBCA04', 'Needs to be reviewed and prioritized', ['triage']),
        C('release-blocker', 'Release', 'Blocker', '⛔', 'release blocker', 'B60205', 'Must land before the next release'),
        C('release-priority', 'Release', 'Priority', '⭐', 'release priority', '0E8A16', 'Wanted in the next release more than the rest; can still be cut'),
        C('release-stretch', 'Release', 'Stretch', '🍒', 'release stretch', 'C2E0C6', 'Nice to have in the next release; pushed if it misses'),
        C('cant-repro', 'Resolution', "Can't repro", '', 'cant repro', '000000', 'Unable to reproduce; add details to reopen', ['cannot reproduce']),
        C('duplicate', 'Resolution', 'Duplicate', '', 'duplicate', '000000', 'Duplicate of another issue or PR'),
        C('external', 'Resolution', 'External', '', 'external', '000000', 'Caused outside this repository'),
        C('invalid', 'Resolution', 'Invalid', '', 'invalid', '000000', 'Not a valid issue or request'),
        C('no-activity', 'Resolution', 'No activity', '', 'no activity', '000000', 'Closed due to inactivity', ['stale']),
        C('wont-fix', 'Resolution', "Won't fix", '', 'wontfix', '000000', 'Will not be worked on', ['wont fix']),
        C('autopilot', 'Status', 'Autopilot', '🤖', 'autopilot', '000000', 'AI drives this PR to merge, escalating only decisions'),
        C('blocked', 'Status', 'Blocked', '⛔', 'blocked', '006B75', 'Blocked on another change or an outside factor'),
        C('finalized', 'Status', 'Finalized', '☑️', 'finalized', '000000', 'Checks pass and every thread is resolved'),
        C('paused', 'Status', 'Paused', '⏸️', 'paused', '000000', 'On hold; automation skips it', ['on hold']),
        C('ready', 'Status', 'Ready', '✅', 'ready', '006B75', 'Approved and ready to merge'),
        C('wip', 'Status', 'WIP', '🚧', 'wip', '000000', 'Someone is working on this now; automation skips it', ['work in progress', 'in progress']),
      ];

      const paint = (code, text) => (supportsColor ? `\x1b[${code}m${text}\x1b[0m` : text);
      const norm = (s) => String(s).toLowerCase().replace(/[^a-z0-9]/g, '');
      // Status labels lead with the emoji; every other label ends with it
      const keyValueName = (d) => {
        const prefix = d.group ? d.group + ': ' : '';
        if (!d.emoji) return prefix + d.value;
        return d.group === 'Status' ? `${prefix}${d.emoji} ${d.value}` : `${prefix}${d.value} ${d.emoji}`;
      };
      // A grouped name must match group and value; a plain name matches value, simple name, or alias
      const grouped = new Map(), plain = new Map();
      const add = (map, k, id) => { if (k && !map.has(norm(k))) map.set(norm(k), id); };
      for (const d of catalog) {
        for (const v of [d.value, ...d.aliases]) add(grouped, d.group ? d.group + v : null, d.id);
        for (const v of [d.value, d.simple, ...d.aliases]) add(plain, v, d.id);
      }
      const match = (name) => (name.includes(":") ? grouped : plain).get(norm(name));
      const isKeyValue = (name) => name.includes(':') || /\p{Extended_Pictographic}/u.test(name);

      let config = {};
      try { config = JSON.parse(fs.readFileSync(path.join(__dirname, '.xe/config/catalyst.json'), 'utf8')); } catch { config = {}; }
      const saved = config.labels || {};
      const overrides = saved.names || {};

      const labels = get('labels') || [];
      const matches = {};
      for (const l of labels) {
        const id = match(l.name);
        if (id) (matches[id] = matches[id] || []).push(l);
      }

      // Unused simple labels are usually GitHub's defaults, so they say nothing.
      // Unused key/value labels were created on purpose, so they count once.
      let simpleUse = 0, keyValueUse = 0;
      for (const list of Object.values(matches)) for (const l of list) {
        if (isKeyValue(l.name)) keyValueUse += Math.max(l.usage, 1); else simpleUse += l.usage;
      }
      const detected = simpleUse > keyValueUse ? 'simple' : 'key-value';

      const typeLabels = new Set(['bug', 'enhancement', 'documentation', 'question']);
      const target = (d, style) => overrides[d.id] || (style === 'simple' ? d.simple : keyValueName(d));
      const primary = (d, style) => {
        const list = matches[d.id] || [];
        return list.find((l) => l.name === target(d, style)) || [...list].sort((a, b) => b.usage - a.usage)[0];
      };

      // Same style as ours, different spelling: ask before renaming them
      const differing = catalog
        .map((d) => ({ d, l: primary(d, 'key-value') }))
        .filter(({ d, l }) => l && isKeyValue(l.name) && l.name !== target(d, 'key-value') && !overrides[d.id])
        .map(({ d, l }) => ({ id: d.id, from: l.name, to: target(d, 'key-value') }));

      const plan = (style, keep) => {
        const names = { ...overrides };
        const ops = [];
        const merges = [];
        for (const d of catalog) {
          const existing = primary(d, style);
          if (keep && existing && isKeyValue(existing.name) && style !== 'simple') names[d.id] = existing.name;
          const name = names[d.id] || target(d, style);
          const op = { name, color: d.color, description: d.description, from: '' };
          if (!existing) ops.push({ ...op, kind: 'add' });
          else if (existing.name !== name) ops.push({ ...op, from: existing.name, kind: 'rename' });
          // Right name, wrong color: fix the color, keep the team's description
          else if (String(existing.color || '').toUpperCase() !== d.color) ops.push({ name, color: d.color, from: '', recolor: true, kind: 'color' });
          // Every other label that matches the same standard label is a duplicate
          for (const dup of (matches[d.id] || []).filter((l) => l !== existing)) {
            merges.push({ name: dup.name, into: name, from: '', merge: true, kind: 'merge' });
          }
        }
        // Merge last, so the label each duplicate merges into exists under its final name
        ops.push(...merges);
        // GitHub's default type labels nobody uses: the issue type field replaces them
        // @req FR:repo-labels/sync.delete
        for (const l of labels) {
          if (typeLabels.has(l.name) && l.usage === 0) ops.push({ name: l.name, delete: true, kind: 'remove' });
        }
        // Declined: keep the repo's own labels so automation uses them
        const kept = { ...overrides };
        for (const d of catalog) {
          const existing = primary(d, style);
          if (existing && !kept[d.id]) kept[d.id] = existing.name;
        }
        // One row per change: {icon} {old} → {new}. The old column pads to the longest old
        // name so the arrows line up; a removed label has no arrow or new name. Emoji take
        // two terminal columns, and the variation selector none.
        // @req FR:repo-labels/sync.summary
        // @req FR:repo-labels/sync.summary.color
        // @req FR:repo-labels/sync.summary.columns
        // @req FR:repo-labels/sync.summary.columns.pad
        // @req FR:repo-labels/sync.summary.columns.removed
        // @req FR:repo-labels/sync.summary.heading
        // @req FR:repo-labels/sync.summary.color.plain
        const width = (t) => [...t.replace(/\uFE0F/g, '')].reduce((n, c) => n + (/\p{Extended_Pictographic}/u.test(c) ? 2 : 1), 0);
        // @req FR:repo-labels/sync.summary.columns.merged
        // @req FR:repo-labels/sync.summary.columns.color
        const oldName = (o) => (o.kind === 'rename' ? o.from : o.kind === 'add' ? '' : o.name);
        const newName = (o) => (o.kind === 'merge' ? o.into : o.kind === 'color' ? `color ${o.color}` : o.name);
        const oldWidth = Math.max(0, ...ops.map((o) => width(oldName(o))));
        const lines = ops.map((o) => {
          const icon = { remove: paint(31, 'x'), merge: paint(31, 'x'), rename: paint(33, '~'), color: paint(33, '~'), add: paint(32, '+') }[o.kind];
          if (o.kind === 'remove') return `  ${icon} ${o.name}`;
          return `  ${icon} ${oldName(o)}${' '.repeat(oldWidth - width(oldName(o)))} → ${newName(o)}`;
        });
        // What each change is doing, for the progress line while applying
        const verb = { remove: 'Deleting', merge: 'Merging', rename: 'Renaming', color: 'Recoloring', add: 'Creating' };
        for (const o of ops) o.status = `${verb[o.kind]} ${o.kind === 'remove' || o.kind === 'add' ? o.name : `${oldName(o)} → ${newName(o)}`}`;
        const title = `${ops.length} label change${ops.length === 1 ? '' : 's'}`;
        const count = (kind) => ops.filter((o) => o.kind === kind).length;
        const brief = [['add', 'add'], ['rename', 'rename'], ['color', 'recolor'], ['merge', 'merge'], ['remove', 'remove']]
          .map(([kind, word]) => count(kind) && `${word} ${count(kind)}`)
          .filter(Boolean).join(', ') || 'no changes';
        const text = (c) => JSON.stringify(c, null, 2) + '\n';
        const cfg = { ...config, labels: { style: keep ? 'custom' : style, ...(Object.keys(names).length ? { names } : {}) } };
        const declinedCfg = { ...config, labels: { style: 'custom', ...(Object.keys(kept).length ? { names: kept } : {}) } };
        return {
          ops,
          lines,
          brief,
          title,
          summary: lines.length ? `${title}:\n${lines.join('\n')}` : 'Labels already match the standard.',
          config: cfg,
          declinedConfig: declinedCfg,
          configText: text(cfg),
          declinedConfigText: text(declinedCfg),
        };
      };

      // Labels outside the catalog. Exceptions: Dependabot's label, and unused type
      // labels (the delete step above removes those). A saved custom name is a
      // catalog label under another name, so it never counts as outside.
      // @req FR:repo-labels/sync.outside
      // @req FR:repo-labels/sync.outside.exceptions
      const exceptions = new Set(['dependencies']);
      const savedNames = new Set(Object.values(overrides));
      // A Key: Value label has a simple twin: its value, lowercase, with no emoji. A simple
      // label has no known Key, so only an AI agent could suggest one (FR:sync.outside.change.suggest).
      const simpleTwin = (name) => {
        if (!name.includes(':')) return '';
        const value = name.slice(name.indexOf(':') + 1).replace(/\p{Extended_Pictographic}\uFE0F?/gu, '').trim().toLowerCase();
        return value && value !== name && !labels.some((l) => l.name === value) ? value : '';
      };
      const extras = labels
        .filter((l) => !match(l.name) && !exceptions.has(l.name) && !(typeLabels.has(l.name) && l.usage === 0) && !savedNames.has(l.name))
        .map((l) => ({ name: l.name, usage: l.usage, suggest: { simple: simpleTwin(l.name), 'key-value': '' } }));
      const plans = {
        'key-value': { standard: plan('key-value', false), keep: plan('key-value', true) },
        simple: { standard: plan('simple', false), keep: plan('simple', true) },
      };
      const inUse = keyValueUse + simpleUse > 0 ? (detected === 'simple' ? 'simple' : 'Key: Value') : 'no standard';
      // Short enough to stay on one row; examples and the changes sit in the details
      const options = [
        { key: 'key-value', label: '&Key: Value (recommended)', description: plans['key-value'].standard.brief },
        ...(differing.length ? [{ key: 'keep', label: 'Keep my &names', description: plans['key-value'].keep.brief }] : []),
        { key: 'simple', label: '&Simple', description: plans.simple.standard.brief },
        { key: 'skip', label: 'Ski&p', description: 'no changes' },
      ];
      // Every change, aligned, so each add, rename, and removal is named
      // @req FR:repo-labels/sync.style.details
      // @req FR:repo-labels/sync.style.details.layout
      const section = (title, p) => (p.ops.length ? `${title}\n${p.summary}` : '');
      const details = [
        `Key: Value looks like Status: ✅ Ready. Simple looks like ready. In use: ${keyValueUse} on Key: Value labels, ${simpleUse} on simple labels.`,
        section('Key: Value', plans['key-value'].standard),
        differing.length ? section('Keep my names', plans['key-value'].keep) : '',
        section('Simple', plans.simple.standard),
      ].filter(Boolean).join('\n\n');

      return {
        extras,
        extrasSummary: extras.map((e) => `  ${e.name} (${e.usage} in use)`).join('\n'),
        detected,
        currentStyle: inUse,
        savedStyle: saved.style || '',
        differing,
        options,
        details,
        plans,
      };

  # Input wins, then the saved choice; otherwise ask, defaulting to what's in use
  # @req FR:repo-labels/sync.style
  # @req FR:repo-labels/sync.style.options
  # @req FR:repo-labels/sync.style.options.key-value
  # @req FR:repo-labels/sync.style.options.keep
  # @req FR:repo-labels/sync.style.options.simple
  - var: style
    value: "${{ get('style') || get('analysis').savedStyle }}"
  - var: keep
    value: "${{ get('style') === 'custom' }}"
  - if: ${{ get('style') === 'custom' }}
    then:
      - var: style
        value: key-value
  - var: asked
    value: ${{ get('available') && !get('style') }}
  - var: apply
    value: false
  - if: "{{asked}}"
    then:
      - name: pick-style
        checkpoint:
          header: "Labels"
          message: "This repo uses {{analysis.currentStyle}} labels. Which style should it use?"
          context: "{{analysis.details}}"
          options: "${{ get('analysis').options }}"
          default: "{{analysis.detected}}"
      - var: picked
        value: "{{pick-style.selected}}"
      # Skip keeps the names the repository already uses, in the style it uses most
      # @req FR:repo-labels/sync.style.options.skip
      - var: style
        value: "${{ get('picked') === 'skip' ? get('analysis').detected : get('picked') === 'simple' ? 'simple' : 'key-value' }}"
      - var: keep
        value: "${{ get('picked') === 'keep' }}"
      - var: apply
        value: "${{ get('picked') !== 'skip' }}"

  - var: chosen
    value: "${{ get('analysis').plans[get('style')][get('keep') ? 'keep' : 'standard'] }}"

  # A question the user just answered already confirmed the changes
  # @req FR:repo-labels/sync.confirm
  - if: ${{ !get('asked') && get('chosen').ops.length > 0 }}
    then:
      - name: confirm
        checkpoint:
          header: "Labels"
          message: "Apply these label changes?"
          context: "{{chosen.summary}}"
          options:
            - key: apply
              label: "&Apply"
              description: Creates, renames, recolors, and merges labels, and deletes unused type labels
            - key: skip
              label: "S&kip"
              description: Changes nothing
          default: apply
      - var: apply
        value: ${{ get('confirm').selected === 'apply' }}

  # @req FR:repo-labels/sync.create
  # @req FR:repo-labels/sync.rename
  # @req FR:repo-labels/sync.delete
  # @req FR:repo-labels/sync.delete.used
  # @req FR:repo-labels/sync.fallback
  - var: failed
    value: 0
  - if: "{{apply}}"
    then:
      # Progress: one line redrawn in place (or a few lines without a terminal), so a long run never looks frozen
      # @req FR:repo-labels/sync.progress
      # @req FR:repo-labels/sync.progress.done
      - for-each: change
        in: "{{chosen.ops}}"
        index: idx
        steps:
          - var: position
            value: ${{ get('idx') + 1 }}
          - display:
              message: "[{{position}}/{{chosen.ops.length}}] {{change.status}}"
              progress: true
              position: "{{position}}"
              total: "{{chosen.ops.length}}"
          - try:
              - if: ${{ get('change').delete === true }}
                then:
                  - github-label-delete: "{{change.name}}"
              - if: ${{ get('change').merge === true }}
                then:
                  - github-label-merge: "{{change.name}}"
                    into: "{{change.into}}"
              - if: ${{ get('change').recolor === true }}
                then:
                  - github-label-edit: "{{change.name}}"
                    color: "{{change.color}}"
              - if: ${{ !get('change').delete && !get('change').merge && !get('change').recolor }}
                then:
                  - if: ${{ get('change').from !== '' }}
                    then:
                      - github-label-edit: "{{change.from}}"
                        newName: "{{change.name}}"
                        color: "{{change.color}}"
                        description: "{{change.description}}"
                    else:
                      - github-label-create: "{{change.name}}"
                        color: "{{change.color}}"
                        description: "{{change.description}}"
            catch:
              - code: "*"
                steps:
                  - display: "⚠️  Labels: couldn't set up {{change.name}} ({{$error.message}}). Steps that need it are skipped until it exists."
                  - var: failed
                    value: ${{ get('failed') + 1 }}
      - if: ${{ get('failed') === 0 }}
        then:
          - display: "\n✅ Applied {{chosen.title}}"
        else:
          - display: "\n⚠️  Labels: {{failed}} of {{chosen.ops.length}} changes failed. Run `catalyst run sync-repo-labels` to retry."

  # Labels outside the standard: review one by one or leave as-is. Each one can
  # stay, change to a suggested name or one you type, or go. Proposing catalog
  # names needs an AI agent in a playbook (ACP): see issue 263.
  # @req FR:repo-labels/sync.outside
  # @req FR:repo-labels/sync.outside.options
  - if: ${{ get('available') && get('analysis').extras.length > 0 }}
    then:
      - var: extras-count
        value: ${{ get('analysis').extras.length }}
      - var: extras-ask
        value: "${{ 'You have ' + get('extras-count') + (get('extras-count') === 1 ? ' label' : ' labels') + ' outside the standard. Review ' + (get('extras-count') === 1 ? 'it' : 'them') + '?' }}"
      - name: pick-extras
        checkpoint:
          header: "Labels"
          message: "{{extras-ask}}"
          context: "{{analysis.extrasSummary}}"
          options:
            - key: review
              label: "&Review one by one"
            - key: leave
              label: "&Leave as-is"
          default: leave
      - if: ${{ get('pick-extras').selected === 'review' }}
        then:
          - var: extras-done
            value: ""
          - var: extras-failed
            value: ""
          - for-each: extra
            in: "{{analysis.extras}}"
            steps:
              - var: suggestion
                value: "${{ get('extra').suggest[get('style')] || '' }}"
              - var: choice
                value: keep
              - var: new-name
                value: ""
              # @req FR:repo-labels/sync.outside.options.keep
              # @req FR:repo-labels/sync.outside.options.change
              # @req FR:repo-labels/sync.outside.options.change.suggest
              # @req FR:repo-labels/sync.outside.options.change.typed
              # @req FR:repo-labels/sync.outside.options.delete
              - if: ${{ !!get('suggestion') }}
                then:
                  - name: review-suggested
                    checkpoint:
                      header: "Labels"
                      message: "{{extra.name}} ({{extra.usage}} in use)"
                      options:
                        - key: keep
                          label: "&Keep {{extra.name}}"
                        - key: suggest
                          label: "&Change to {{suggestion}}"
                        - key: rename
                          label: "Change to &another name"
                          allowText: true
                        - key: delete
                          label: "&Delete"
                      default: keep
                  - var: choice
                    value: "{{review-suggested.selected}}"
                  - var: new-name
                    value: "${{ get('choice') === 'suggest' ? get('suggestion') : get('review-suggested').textInput || '' }}"
                else:
                  - name: review-plain
                    checkpoint:
                      header: "Labels"
                      message: "{{extra.name}} ({{extra.usage}} in use)"
                      options:
                        - key: keep
                          label: "&Keep {{extra.name}}"
                        - key: rename
                          label: "&Change to another name"
                          allowText: true
                        - key: delete
                          label: "&Delete"
                      default: keep
                  - var: choice
                    value: "{{review-plain.selected}}"
                  - var: new-name
                    value: "${{ get('review-plain').textInput || '' }}"
              # A change with no name typed is a keep
              - try:
                  - if: ${{ get('choice') === 'delete' }}
                    then:
                      - github-label-delete: "{{extra.name}}"
                      - var: extras-done
                        value: "${{ get('extras-done') + '\n  delete  ' + get('extra').name }}"
                  - if: ${{ get('choice') !== 'delete' && !!get('new-name') && get('new-name') !== get('extra').name }}
                    then:
                      - github-label-edit: "{{extra.name}}"
                        newName: "{{new-name}}"
                      - var: extras-done
                        value: "${{ get('extras-done') + '\n  rename  ' + get('extra').name + ' → ' + get('new-name') }}"
                catch:
                  - code: "*"
                    steps:
                      - var: extras-failed
                        value: "{{extras-failed}}\n  {{extra.name}} ({{$error.message}})"
          # Say what changed and what didn't, as the standard changes do. No retry:
          # the rest is the user's to do on GitHub.
          # @req FR:repo-labels/sync.outside.report
          - if: ${{ !!get('extras-done') }}
            then:
              - display: "\n✅ Labels: changed outside labels:{{extras-done}}"
          - if: ${{ !!get('extras-failed') }}
            then:
              - display: "\n⚠️  Labels: couldn't change these outside labels, so change them on GitHub:{{extras-failed}}"

  # @req FR:repo-labels/sync.config
  # @req FR:repo-labels/sync.config.declined
  - if: "{{available}}"
    then:
      - var: config-text
        value: "${{ get('chosen').ops.length > 0 && !get('apply') ? get('chosen').declinedConfigText : get('chosen').configText }}"
      - file-write: .xe/config/catalyst.json
        content: "{{config-text}}"

  - if: ${{ get('available') && get('chosen').ops.length === 0 }}
    then:
      - display: "\n✅ Labels: already match the standard."
