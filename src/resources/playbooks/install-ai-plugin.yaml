# @req FR:ai-plugin/install.@playbook
id: install-ai-plugin
description: Remove AI command files generated by earlier Catalyst versions so Catalyst plugin skills don't appear twice.
owner: Engineer

# @req FR:ai-plugin/install.input
inputs:
  - string: project-root
    required: true
    description: Consumer project directory

steps:
  # ------------------------------------------------------------------
  # Delete generated command files. Only the exact generated patterns are
  # touched; anything else in these directories belongs to the user.
  # @req FR:ai-plugin/install.legacy
  # @req FR:ai-plugin/install.legacy.directories
  # @req FR:ai-plugin/install.preserve
  # @req FR:ai-plugin/install.idempotent
  # ------------------------------------------------------------------
  - name: legacy
    script: |
      const root = get('project-root');
      const headers = ['# catalyst commands', '# generated by catalyst — do not edit manually'];
      const removed = [];
      const remove = (file) => {
        fs.rmSync(file);
        removed.push(path.relative(root, file));
      };

      // A generated folder .gitignore holds only a Catalyst header and `*`
      const isGeneratedIgnore = (file) => {
        const lines = fs.readFileSync(file, 'utf8').split('\n').map((l) => l.trim()).filter(Boolean);
        return lines.length > 0 && lines.every((l) => l === '*' || headers.includes(l.toLowerCase()));
      };

      for (const rel of ['.claude/commands/catalyst', '.cursor/commands/catalyst']) {
        const dir = path.join(root, rel);
        if (!fs.existsSync(dir)) continue;
        for (const file of fs.readdirSync(dir)) {
          if (file.endsWith('.md')) remove(path.join(dir, file));
        }
        const ignore = path.join(dir, '.gitignore');
        if (fs.existsSync(ignore) && isGeneratedIgnore(ignore)) remove(ignore);
        if (fs.readdirSync(dir).length === 0) fs.rmdirSync(dir);
      }

      const prompts = path.join(root, '.github', 'prompts');
      if (fs.existsSync(prompts)) {
        for (const file of fs.readdirSync(prompts)) {
          if (/^catalyst\.[a-z0-9-]+\.prompt\.md$/.test(file)) remove(path.join(prompts, file));
        }
      }

      return {
        promptsIgnore: path.join(prompts, '.gitignore'),
        hasPromptsIgnore: fs.existsSync(path.join(prompts, '.gitignore')),
        removed
      };

  # ------------------------------------------------------------------
  # Remove the Catalyst sections from the flat prompts .gitignore, under both
  # headers earlier versions wrote, then delete the file if nothing is left.
  # @req FR:ai-plugin/install.legacy.gitignore
  # ------------------------------------------------------------------
  - if: ${{ get('legacy').hasPromptsIgnore }}
    then:
      - gitignore-edit:
          path: "{{legacy.promptsIgnore}}"
          header: "Catalyst commands"
          remove: [".gitignore", "catalyst.*.prompt.md"]
      - gitignore-edit:
          path: "{{legacy.promptsIgnore}}"
          header: "Generated by Catalyst — do not edit manually"
          remove: [".gitignore", "catalyst.*.prompt.md"]
      - script: |
          const file = get('legacy').promptsIgnore;
          if (fs.readFileSync(file, 'utf8').trim() === '') fs.rmSync(file);
          return null;
