# @req FR:pull-request-workflow/autopilot.@playbook
name: autopilot-pull-request
description: Merge an Autopilot pull request autonomously when it passes every merge gate.
owner: Engineer

# @req FR:pull-request-workflow/autopilot.input
inputs:
  - number: pr-number
    description: GitHub PR number to check and merge
    required: true

steps:
  - name: labels
    playbook: get-pull-request-labels

  - name: pr
    github-pr-get: "{{pr-number}}"

  # Check the merge gates in order, from the PR's facts at its head commit. A
  # gate with a `label` refuses a PR that has that label; any other gate
  # refuses the PR when `refused` is true. The first refused gate ends the check.
  # @req FR:pull-request-workflow/autopilot.gates
  # @req FR:pull-request-workflow/autopilot.gates.order
  - function: check-merge-gates
    steps:
      - for-each: gate
        in:
          # @req FR:pull-request-workflow/autopilot.gates.autopilot
          - refused: ${{ !get('pr').labels.includes(get('labels').autopilot) }}
            code: PullRequestNotAutopilot
            message: The PR doesn't have the Autopilot label.
          # @req FR:pull-request-workflow/autopilot.gates.paused
          - label: paused
            code: PullRequestPaused
            message: The PR is paused.
          # @req FR:pull-request-workflow/autopilot.gates.blocked
          - label: blocked
            code: PullRequestBlocked
            message: The PR is blocked.
          # @req FR:pull-request-workflow/autopilot.gates.wip
          - label: wip
            code: PullRequestBusy
            message: Someone is still working on the PR.
          # @req FR:pull-request-workflow/autopilot.gates.draft
          - refused: ${{ get('pr').isDraft }}
            code: PullRequestNotPublished
            message: The PR is still a draft.
          # @req FR:pull-request-workflow/autopilot.gates.merge-state
          - refused: ${{ !['CLEAN', 'HAS_HOOKS', 'UNSTABLE'].includes(get('pr').mergeStateStatus) }}
            code: PullRequestNotMergeable
            message: >-
              ${{ "GitHub can't merge the PR yet (merge state: " + (get('pr').mergeStateStatus || 'unknown').toLowerCase() + ")." }}
          # @req FR:pull-request-workflow/autopilot.gates.checks
          - refused: ${{ !get('pr').checksPassed }}
            code: PullRequestChecksNotPassing
            message: A check failed or is still running.
          # @req FR:pull-request-workflow/autopilot.gates.changes-requested
          - refused: ${{ get('pr').changesRequested }}
            code: PullRequestChangesRequested
            message: A reviewer requested changes.
          # @req FR:pull-request-workflow/autopilot.gates.approval
          - refused: ${{ get('pr').reviewRequired && !get('pr').approved }}
            code: PullRequestNotApproved
            message: The PR needs more approvals.
          # @req FR:pull-request-workflow/autopilot.gates.code-owner
          - refused: ${{ !get('pr').codeOwnerApproved }}
            code: PullRequestNotCodeOwnerApproved
            message: A code owner needs to approve the PR.
          # @req FR:pull-request-workflow/autopilot.gates.threads
          - refused: ${{ get('pr').threadsUnresolved > 0 }}
            code: PullRequestHasUnresolvedThreads
            message: "${{ get('pr').threadsUnresolved === 1 ? '1 review thread is unresolved.' : get('pr').threadsUnresolved + ' review threads are unresolved.' }}"
          # Last, so a failed check or open thread is named first
          # @req FR:pull-request-workflow/autopilot.gates.needs-attention
          - label: needsAttention
            code: PullRequestNeedsAttention
            message: The PR is waiting on its author.
        steps:
          - if: "${{ get('gate').label ? get('pr').labels.includes(get('labels')[get('gate').label]) : get('gate').refused }}"
            then:
              - return:
                  outputs:
                    code: "{{gate.code}}"
                    message: "{{gate.message}}"

      - return:
          outputs:
            code: GatesPassed
            message: The PR passes every merge gate.

  - name: gates
    check-merge-gates: {}

  # @req FR:pull-request-workflow/autopilot.finalized
  - github-pr-edit: "{{pr-number}}"
    addLabels:
      - "${{ get('gates').code === 'GatesPassed' ? get('labels').finalized : '' }}"
    removeLabels:
      - "${{ get('gates').code === 'GatesPassed' ? '' : get('labels').finalized }}"

  # Any other PR isn't meant to merge, so it holds without a word
  # @req FR:pull-request-workflow/autopilot.result
  - if: ${{ get('gates').code === 'PullRequestNotAutopilot' }}
    then:
      - return:
          outputs: "${{ get('gates') }}"

  # @req FR:pull-request-workflow/autopilot.merge.hold
  - if: ${{ get('gates').code !== 'GatesPassed' }}
    then:
      - display: "PR {{pr-number}} isn't merging. {{gates.message}}"
      - return:
          outputs: "${{ get('gates') }}"

  # @req FR:pull-request-workflow/autopilot.merge.author
  # @req FR:pull-request-workflow/autopilot.merge.hold
  - if: ${{ !get('pr').authoredByViewer }}
    then:
      - var: hold
        value: "${{ 'Autopilot merges only PRs you opened. ' + get('pr').author + \" opened this one; you're signed in as \" + (get('pr').viewer || 'an unknown user') + '.' }}"
      - display: "PR {{pr-number}} isn't merging. {{hold}}"
      - return:
          outputs:
            code: NotPullRequestAuthor
            message: "{{hold}}"

  # The merge refuses the PR if a push lands after this read
  # @req FR:pull-request-workflow/autopilot.merge
  # @req FR:pull-request-workflow/autopilot.merge.head-sha
  - name: merge
    playbook: merge-pull-request
    inputs:
      pr-number: "{{pr-number}}"
      sha: "{{pr.headSha}}"

  - return:
      outputs: "${{ get('merge') }}"
