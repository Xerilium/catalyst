# @req FR:pull-request-workflow/autopilot.@playbook
name: autopilot-pull-request
description: Merge an Autopilot pull request autonomously when it passes every merge gate.
owner: Engineer

# @req FR:pull-request-workflow/autopilot.input
inputs:
  - number: pr-number
    description: GitHub PR number to check and merge
    required: true

steps:
  - name: labels
    playbook: get-pull-request-labels

  - name: pr
    github-pr-get: "{{pr-number}}"

  # Check the merge gates in order, from the PR's facts at its head commit.
  # The first gate the PR fails ends the check with that gate's code and message.
  # @req FR:pull-request-workflow/autopilot.gates
  # @req FR:pull-request-workflow/autopilot.gates.order
  - function: check-merge-gates
    steps:
      # @req FR:pull-request-workflow/autopilot.gates.autopilot
      - if: ${{ !get('pr').labels.includes(get('labels').autopilot) }}
        then:
          - return: { outputs: { code: AutopilotLabelMissing, message: it has no Autopilot label } }

      # @req FR:pull-request-workflow/autopilot.gates.paused
      - if: ${{ get('pr').labels.includes(get('labels').paused) }}
        then:
          - return: { outputs: { code: PullRequestPaused, message: it has the Paused label } }

      # @req FR:pull-request-workflow/autopilot.gates.blocked
      - if: ${{ get('pr').labels.includes(get('labels').blocked) }}
        then:
          - return: { outputs: { code: PullRequestBlocked, message: it has the Blocked label } }

      # @req FR:pull-request-workflow/autopilot.gates.wip
      - if: ${{ get('pr').labels.includes(get('labels').wip) }}
        then:
          - return: { outputs: { code: PullRequestWip, message: it has the WIP label } }

      # @req FR:pull-request-workflow/autopilot.gates.draft
      - if: ${{ get('pr').isDraft }}
        then:
          - return: { outputs: { code: PullRequestDraft, message: it is a draft } }

      # @req FR:pull-request-workflow/autopilot.gates.merge-state
      - if: ${{ !['CLEAN', 'HAS_HOOKS', 'UNSTABLE'].includes(get('pr').mergeStateStatus) }}
        then:
          - return: { outputs: { code: MergeStateNotClean, message: "GitHub reports its merge state as {{pr.mergeStateStatus}}" } }

      # @req FR:pull-request-workflow/autopilot.gates.checks
      - if: ${{ !get('pr').checksPassed }}
        then:
          - return: { outputs: { code: ChecksNotPassing, message: a check failed or is still running } }

      # @req FR:pull-request-workflow/autopilot.gates.changes-requested
      - if: ${{ get('pr').changesRequested }}
        then:
          - return: { outputs: { code: ChangesRequested, message: a reviewer requested changes } }

      # @req FR:pull-request-workflow/autopilot.gates.approval
      - if: ${{ get('pr').reviewRequired && !get('pr').approved }}
        then:
          - return: { outputs: { code: ApprovalMissing, message: it lacks the approvals the repository requires } }

      # @req FR:pull-request-workflow/autopilot.gates.code-owner
      - if: ${{ !get('pr').codeOwnerApproved }}
        then:
          - return: { outputs: { code: CodeOwnerApprovalMissing, message: a code owner has not approved } }

      # @req FR:pull-request-workflow/autopilot.gates.threads
      - if: ${{ get('pr').threadsUnresolved > 0 }}
        then:
          - return:
              outputs:
                code: ThreadsUnresolved
                message: "${{ get('pr').threadsUnresolved === 1 ? '1 review thread is unresolved' : get('pr').threadsUnresolved + ' review threads are unresolved' }}"

      - return: { outputs: { code: GatesPassed, message: it passes every merge gate } }

  - name: gates
    check-merge-gates: {}

  # @req FR:pull-request-workflow/autopilot.finalized
  - github-pr-edit: "{{pr-number}}"
    addLabels:
      - "${{ get('gates').code === 'GatesPassed' ? get('labels').finalized : '' }}"
    removeLabels:
      - "${{ get('gates').code === 'GatesPassed' ? '' : get('labels').finalized }}"

  # Any other PR isn't meant to merge, so it holds without a word
  # @req FR:pull-request-workflow/autopilot.result
  - if: ${{ get('gates').code === 'AutopilotLabelMissing' }}
    then:
      - return: { outputs: "${{ get('gates') }}" }

  # @req FR:pull-request-workflow/autopilot.merge.hold
  - if: ${{ get('gates').code !== 'GatesPassed' }}
    then:
      - display: "PR {{pr-number}}: not merging; {{gates.message}}"
      - return: { outputs: "${{ get('gates') }}" }

  # @req FR:pull-request-workflow/autopilot.merge.author
  # @req FR:pull-request-workflow/autopilot.merge.hold
  - if: ${{ !get('pr').authoredByViewer }}
    then:
      - var: hold
        value: "${{ 'it was opened by ' + get('pr').author + ', not the signed-in user ' + (get('pr').viewer || '(unknown)') }}"
      - display: "PR {{pr-number}}: not merging; {{hold}}"
      - return: { outputs: { code: AuthorNotViewer, message: "{{hold}}" } }

  # The merge refuses the PR if a push lands after this read
  # @req FR:pull-request-workflow/autopilot.merge
  # @req FR:pull-request-workflow/autopilot.merge.head-sha
  - name: merge
    playbook: merge-pull-request
    inputs:
      pr-number: "{{pr-number}}"
      sha: "{{pr.headSha}}"

  - return: { outputs: "${{ get('merge') }}" }
