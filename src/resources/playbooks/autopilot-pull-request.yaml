# @req FR:pull-request-workflow/autopilot.@playbook
name: autopilot-pull-request
description: Merge an Autopilot pull request autonomously when it passes every merge gate.
owner: Engineer

# @req FR:pull-request-workflow/autopilot.input
inputs:
  - number: pr-number
    description: GitHub PR number to check and merge
    required: true
  # @req FR:pull-request-workflow/autopilot.dry-run
  - boolean: dry-run
    description: Say whether the PR would merge, without changing anything
    required: false
  # @req FR:pull-request-workflow/autopilot.skip-checks
  - string: skip-checks
    description: Comma-separated names of checks to ignore, added to pull-requests.reconcile.skip-checks
    required: false
  # @req FR:pull-request-workflow/autopilot.dry-run.labels
  - string: projected-labels
    description: On a dry run, the labels the caller would leave on the PR, one per line; Default the PR's labels
    required: false

steps:
  - name: labels
    playbook: get-pull-request-labels

  - name: pr
    github-pr-get: "{{pr-number}}"
    skipChecks: ${{ get('skip-checks') || [] }}

  # The labels the gates read: on a dry run, the ones the caller would leave
  # @req FR:pull-request-workflow/autopilot.dry-run.labels
  - var: pr-labels
    value: "${{ get('dry-run') === true && get('projected-labels') ? get('projected-labels').split('\\n') : get('pr').labels }}"

  # Is the PR worth testing? It must pass every gate below except code-owner
  # approval. The policy check handles that one itself, before it runs any test.
  - var: facts
    value: >-
      ${{ get('pr-labels').includes(get('labels').autopilot)
      && !get('pr-labels').includes(get('labels').paused)
      && !get('pr-labels').includes(get('labels').blocked)
      && !get('pr-labels').includes(get('labels').wip)
      && !get('pr').isDraft
      && ['CLEAN', 'HAS_HOOKS', 'UNSTABLE'].includes(get('pr').mergeStateStatus)
      && get('pr').checksPassed
      && !get('pr').changesRequested
      && (!get('pr').reviewRequired || get('pr').approved)
      && get('pr').threadsUnresolved === 0
      && !get('pr-labels').includes(get('labels').needsAttention) }}

  # The policy gates, in order: never-merge repos, code owners (or the waiver),
  # required checks, then the tests. Tests run only on your own Autopilot PR.
  # As on GitHub, only owners of changed files gate: a file owned by anyone but
  # the author (user, team, or email) needs a human approval; a solo repo needs none.
  # Settings live in `pull-requests.merge` in `.xe/config/catalyst.json` on the base branch:
  # - `never`: repos that never merge (`owner/repo`, `*` = any)
  # - `approval-waiver-days`: repo to days idle before code-owner sign-off is waived
  # - `strict-check`: fail on `catalyst check` warnings, not just errors
  # - `checks`: `local` (default) ignores GitHub checks and needs a top-level comment
  #   from the author or signed-in user that starts with `🤖 [AI] local CI passed` and
  #   names the head SHA or is newer than the head commit; `remote` gates on GitHub checks
  # A missing setting turns that rule off.
  # @req FR:pull-request-workflow/autopilot.gates.policy
  # @req FR:pull-request-workflow/autopilot.gates.policy.excluded
  # @req FR:pull-request-workflow/autopilot.gates.policy.code-owner
  # @req FR:pull-request-workflow/autopilot.gates.policy.code-owner.author
  # @req FR:pull-request-workflow/autopilot.gates.policy.waiver
  # @req FR:pull-request-workflow/autopilot.gates.policy.checks
  # @req FR:pull-request-workflow/autopilot.gates.policy.playwright
  # @req FR:pull-request-workflow/autopilot.gates.policy.catalyst-check
  # @req FR:pull-request-workflow/autopilot.gates.policy.catalyst-check.strict
  # @req FR:pull-request-workflow/autopilot.gates.policy.verified
  - name: policy
    github-pr-gates: "{{pr-number}}"
    snapshot: ${{ get('pr') }}
    tests: ${{ get('facts') && get('pr').authoredByViewer }}

  # Check the merge gates in order, from the PR's facts at its head commit. A
  # gate with a `label` refuses a PR that has that label; any other gate
  # refuses the PR when `refused` is true. The first refused gate ends the check.
  # @req FR:pull-request-workflow/autopilot.gates
  # @req FR:pull-request-workflow/autopilot.gates.order
  - function: check-merge-gates
    steps:
      - for-each: gate
        in:
          # @req FR:pull-request-workflow/autopilot.gates.autopilot
          - refused: ${{ !get('pr-labels').includes(get('labels').autopilot) }}
            code: PullRequestNotAutopilot
            message: PR doesn't have Autopilot enabled.
          # @req FR:pull-request-workflow/autopilot.gates.paused
          - label: paused
            code: PullRequestPaused
            message: PR is paused.
          # @req FR:pull-request-workflow/autopilot.gates.blocked
          - label: blocked
            code: PullRequestBlocked
            message: PR is blocked.
          # @req FR:pull-request-workflow/autopilot.gates.needs-live-test
          - label: needsLiveTest
            code: PullRequestNeedsLiveTest
            message: PR needs manual verification by a human.
          # @req FR:pull-request-workflow/autopilot.gates.wip
          - label: wip
            code: PullRequestBusy
            message: PR is still being worked on.
          # @req FR:pull-request-workflow/autopilot.gates.draft
          - refused: ${{ get('pr').isDraft }}
            code: PullRequestNotPublished
            message: PR is still a draft.
          # @req FR:pull-request-workflow/autopilot.gates.merge-state
          - refused: ${{ !['CLEAN', 'HAS_HOOKS', 'UNSTABLE'].includes(get('pr').mergeStateStatus) }}
            code: PullRequestNotMergeable
            message: >-
              ${{ "PR can't merge yet (merge state: " + (get('pr').mergeStateStatus || 'unknown').toLowerCase() + ")." }}
          # @req FR:pull-request-workflow/autopilot.gates.checks
          # @req FR:pull-request-workflow/autopilot.gates.checks.local
          - refused: ${{ !get('pr').checksPassed }}
            code: PullRequestChecksNotPassing
            message: "${{ 'PR has a failed or running check: ' + (get('pr').checksBlocking.join(', ') || 'unknown') + '.' }}"
          # @req FR:pull-request-workflow/autopilot.gates.changes-requested
          - refused: ${{ get('pr').changesRequested }}
            code: PullRequestChangesRequested
            message: PR has requested changes.
          # @req FR:pull-request-workflow/autopilot.gates.approval
          - refused: ${{ get('pr').reviewRequired && !get('pr').approved }}
            code: PullRequestNotApproved
            message: PR needs more approvals.
          # The approval waiver skips the code-owner rule
          # @req FR:pull-request-workflow/autopilot.gates.code-owner
          # @req FR:pull-request-workflow/autopilot.gates.policy.waiver
          - refused: ${{ !get('pr').codeOwnerApproved && !get('policy').waived }}
            code: PullRequestNotCodeOwnerApproved
            message: PR needs a code owner's approval.
          # @req FR:pull-request-workflow/autopilot.gates.threads
          - refused: ${{ get('pr').threadsUnresolved > 0 }}
            code: PullRequestHasUnresolvedThreads
            message: "${{ get('pr').threadsUnresolved === 1 ? 'PR has 1 unresolved review thread.' : 'PR has ' + get('pr').threadsUnresolved + ' unresolved review threads.' }}"
          # Last, so a failed check or open thread is named first
          # @req FR:pull-request-workflow/autopilot.gates.needs-attention
          - label: needsAttention
            code: PullRequestNeedsAttention
            message: "${{ 'PR is waiting on its author (' + get('pr').author + ').' }}"
          # Policy gates go last. On someone else's PR the tests never run, so skip
          # "tests not run": the author check below gives the real reason.
          # @req FR:pull-request-workflow/autopilot.gates.policy
          - refused: ${{ !get('policy').pass && (get('policy').code !== 'NotVerified' || get('pr').authoredByViewer) }}
            code: ${{ get('policy').code || '' }}
            message: ${{ get('policy').message || '' }}
        steps:
          - if: "${{ get('gate').label ? get('pr-labels').includes(get('labels')[get('gate').label]) : get('gate').refused }}"
            then:
              - return:
                  outputs:
                    code: "{{gate.code}}"
                    message: "{{gate.message}}"

      - return:
          outputs:
            code: GatesPassed
            message: PR passes every merge gate.

  - name: gates
    check-merge-gates: {}

  # Finalized means the tests ran too. On someone else's PR they never run, so
  # leave the label as the author's last run set it.
  # @req FR:pull-request-workflow/autopilot.finalized
  # @req FR:pull-request-workflow/autopilot.finalized.unverified
  - github-pr-edit: "{{pr-number}}"
    dryRun: ${{ get('dry-run') === true }}
    addLabels:
      - "${{ get('gates').code === 'GatesPassed' && get('policy').pass ? get('labels').finalized : '' }}"
    removeLabels:
      - "${{ get('gates').code === 'GatesPassed' ? '' : get('labels').finalized }}"

  # @req FR:pull-request-workflow/autopilot.merge.hold
  - if: ${{ get('gates').code !== 'GatesPassed' }}
    then:
      - display: "PR {{pr-number}} isn't merging. {{gates.message}}"
      - return:
          outputs: "${{ get('gates') }}"

  # @req FR:pull-request-workflow/autopilot.merge.author
  # @req FR:pull-request-workflow/autopilot.merge.hold
  - if: ${{ !get('pr').authoredByViewer }}
    then:
      - var: hold
        value: '${{ ''Autopilot merges only PRs you opened. '' + get(''pr'').author + " opened this one; you''re signed in as " + (get(''pr'').viewer || ''an unknown user'') + ''.'' }}'
      - display: "PR {{pr-number}} isn't merging. {{hold}}"
      - return:
          outputs:
            code: NotPullRequestAuthor
            message: "{{hold}}"

  # The merge refuses the PR if a push lands after this read
  # @req FR:pull-request-workflow/autopilot.merge
  # @req FR:pull-request-workflow/autopilot.merge.head-sha
  - name: merge
    playbook: merge-pull-request
    inputs:
      pr-number: "{{pr-number}}"
      sha: "{{pr.headSha}}"
      dry-run: ${{ get('dry-run') === true }}
      skip-checks: "${{ get('skip-checks') || '' }}"
      # @req FR:pull-request-workflow/autopilot.merge.waiver
      code-owner-waived: ${{ get('policy').waived }}

  - return:
      outputs: "${{ get('merge') }}"
