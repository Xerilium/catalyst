# @req FR:pull-request-workflow/retarget.@playbook
name: retarget-pull-requests
description: When a pull request closes unmerged, move the open PRs stacked on it onto its base branch.
owner: Engineer

# @req FR:pull-request-workflow/retarget.input
inputs:
  - number: pr-number
    description: GitHub PR number of the closed PR
    required: true
  - boolean: dry-run
    description: Decide and report without changing anything on GitHub
    required: false

steps:
  - name: closed
    github-pr-get: "{{pr-number}}"

  # @req FR:pull-request-workflow/retarget.unmerged
  - if: ${{ get('closed').state !== 'CLOSED' }}
    then:
      - display: "PR {{pr-number}} isn't closed unmerged, so nothing changed."
      - return: PullRequestNotClosedUnmerged

  # A fork's branch name says nothing about this repository's stacks
  # @req FR:pull-request-workflow/retarget.same-repository
  - if: ${{ !get('closed').sameRepository }}
    then:
      - display: "PR {{pr-number}} came from a fork, so nothing changed."
      - return: PullRequestFromFork

  # @req FR:pull-request-workflow/retarget.long-lived
  - if: ${{ get('closed').headLongLived }}
    then:
      - display: "PR {{pr-number}} was closed from {{closed.headRef}}, a long-lived branch, so nothing changed."
      - return: LongLivedBranch

  # @req FR:pull-request-workflow/retarget.move
  - name: stacked
    github-pr-list: open
    base: "{{closed.headRef}}"

  - var: failed
    value: 0
  # @req FR:pull-request-workflow/retarget.move.continue
  - for-each: each
    in: "${{ get('stacked') }}"
    steps:
      - try:
          - github-pr-edit: ${{ get('each').number }}
            base: "{{closed.baseRef}}"
            dryRun: ${{ get('dry-run') === true }}
          # @req FR:pull-request-workflow/retarget.move.comment
          - if: ${{ get('dry-run') === true }}
            then:
              - display: "PR {{each.number}}: Would move onto {{closed.baseRef}} (was {{closed.headRef}})."
            else:
              - github-pr-comment: ${{ get('each').number }}
                body: "⚛️ [Catalyst] Retargeted from `{{closed.headRef}}` to `{{closed.baseRef}}`, because #{{pr-number}} closed without merging."
              - display: "PR {{each.number}}: Moved onto {{closed.baseRef}}."
        catch:
          - code: "*"
            steps:
              - var: failed
                value: ${{ get('failed') + 1 }}
              - display: "PR {{each.number}}: Couldn't retarget. {{$error.message}}"

  # @req FR:pull-request-workflow/retarget.move.fail
  - if: ${{ get('failed') > 0 }}
    then:
      - throw: RetargetFailed
        message: "${{ get('failed') + ' of ' + get('stacked').length + ' stacked PRs failed to retarget.' }}"
