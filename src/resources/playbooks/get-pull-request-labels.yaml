# @req FR:pull-request-workflow/labels.@playbook
name: get-pull-request-labels
description: Get this repository's name for each standard label, and the hash commands that add one, from the label config in `.xe/config/catalyst.json`, or empty when the repository doesn't have the label.
owner: Engineer

steps:
  # The label config, if any; none leaves the standard names
  - var: config
    value: ${{ get('xe://config/catalyst.json') || '{}' }}

  - name: repo-labels
    github-label-list:

  # Per label: `labels.names.{id}` if set; else the simple name when `labels.style`
  # is `simple`; else the standard name (`key-value`, `custom`, or any other style). Keep in sync with FR:repo-labels/catalog.
  # A label the repository doesn't have is empty.
  # @req FR:pull-request-workflow/labels.config
  # @req FR:pull-request-workflow/labels.missing
  # @req FR:pull-request-workflow/labels.hashtags
  - name: result
    script: |
      const CATALOG = {
        autopilot: ['autopilot', 'Status: 🤖 Autopilot', 'autopilot'],
        blocked: ['blocked', 'Status: ⛔ Blocked', 'blocked'],
        breakingChange: ['breaking-change', 'Breaking change 🚨', 'breaking change'],
        cantRepro: ['cant-repro', "Resolution: Can't repro", 'cant repro'],
        duplicate: ['duplicate', 'Resolution: Duplicate', 'duplicate'],
        external: ['external', 'Resolution: External', 'external'],
        finalized: ['finalized', 'Status: ☑️ Finalized', 'finalized'],
        goodFirstIssue: ['good-first-issue', 'Good first issue 🏆', 'good first issue'],
        helpWanted: ['help-wanted', 'Help wanted ✨', 'help wanted'],
        hotfix: ['hotfix', 'Hotfix 🔥', 'hotfix'],
        invalid: ['invalid', 'Resolution: Invalid', 'invalid'],
        needsAttention: ['needs-attention', 'Needs: Attention 👋', 'needs attention'],
        needsLiveTest: ['needs-live-test', 'Needs: Live test 🔬', 'needs live test'],
        needsReview: ['needs-review', 'Needs: Review 👀', 'needs review'],
        needsTriage: ['needs-triage', 'Needs: Triage 🔍', 'needs triage'],
        noActivity: ['no-activity', 'Resolution: No activity', 'no activity'],
        paused: ['paused', 'Status: ⏸️ Paused', 'paused'],
        ready: ['ready', 'Status: ✅ Ready', 'ready'],
        releaseBlocker: ['release-blocker', 'Release: Blocker ⛔', 'release blocker'],
        releasePriority: ['release-priority', 'Release: Priority ⭐', 'release priority'],
        releaseStretch: ['release-stretch', 'Release: Stretch 🍒', 'release stretch'],
        wip: ['wip', 'Status: 🚧 WIP', 'wip'],
        wontFix: ['wont-fix', "Resolution: Won't fix", 'wontfix'],
      };
      let labels = {};
      try { labels = JSON.parse(get('config')).labels || {}; } catch { /* unreadable config: standard names */ }
      const custom = labels.names || {};
      const style = labels.style === 'simple' ? 2 : 1;
      const present = new Set((get('repo-labels') || []).map((l) => l.name));
      const names = {};
      // Hash commands: each label's id is its hashtag; these labels have their own handling
      const NOT_COMMANDS = new Set(['autopilot', 'finalized', 'needs-attention', 'needs-review', 'ready']);
      names.commands = [];
      for (const [key, entry] of Object.entries(CATALOG)) {
        const name = custom[entry[0]] || entry[style];
        names[key] = present.has(name) ? name : '';
        if (names[key] && !NOT_COMMANDS.has(entry[0])) { names.commands.push({ tag: entry[0], label: name }); }
      }
      return names;

  - return: "{{result}}"
