# @req FR:cli-init/init.legacy
id: remove-legacy-commands
description: Remove AI command files generated by earlier Catalyst versions so Catalyst plugin skills don't appear twice.
owner: Engineer

steps:
  # ------------------------------------------------------------------
  # Delete generated command files. Only the exact generated patterns are
  # touched; anything else in these directories belongs to the user.
  # Paths are relative to the consumer project (the directory Catalyst runs in).
  # @req FR:cli-init/init.legacy.files
  # @req FR:cli-init/init.legacy.preserve
  # @req FR:cli-init/init.idempotent
  # ------------------------------------------------------------------
  - name: legacy-files
    file-glob:
      patterns:
        - ".claude/commands/catalyst/*.md"
        - ".cursor/commands/catalyst/*.md"
        - ".github/prompts/catalyst.*.prompt.md"

  - for-each: file
    in: ${{ get('legacy-files') }}
    steps:
      - file-delete:
          path: "{{file}}"
          ignoreMissing: true

  # ------------------------------------------------------------------
  # Delete the generated folder .gitignore (only a Catalyst header and `*`),
  # then remove the command directories once they are empty.
  # @req FR:cli-init/init.legacy.directories
  # ------------------------------------------------------------------
  - for-each: dir
    in: [".claude/commands/catalyst", ".cursor/commands/catalyst"]
    steps:
      - name: dir-ignore
        file-read:
          path: "{{dir}}/.gitignore"
          ignoreMissing: true
      # A generated folder .gitignore holds only a Catalyst header and `*`
      - name: dir-ignore-generated
        script: |
          const content = get('dir-ignore');
          if (content === null) return false;
          const headers = ['# catalyst commands', '# generated by catalyst — do not edit manually'];
          const lines = content.split('\n').map((l) => l.trim()).filter(Boolean);
          return lines.length > 0 && lines.every((l) => l === '*' || headers.includes(l.toLowerCase()));
      - if: ${{ get('dir-ignore-generated') }}
        then:
          - file-delete: "{{dir}}/.gitignore"
      - dir-remove-empty: "{{dir}}"

  # ------------------------------------------------------------------
  # Remove the Catalyst sections from the flat prompts .gitignore, under both
  # headers earlier versions wrote, then delete the file if nothing is left.
  # @req FR:cli-init/init.legacy.gitignore
  # ------------------------------------------------------------------
  - name: prompts-ignore-exists
    file-exists: .github/prompts/.gitignore

  - if: ${{ get('prompts-ignore-exists') }}
    then:
      - gitignore-edit:
          path: .github/prompts/.gitignore
          header: "Catalyst commands"
          remove: [".gitignore", "catalyst.*.prompt.md"]
      - gitignore-edit:
          path: .github/prompts/.gitignore
          header: "Generated by Catalyst — do not edit manually"
          remove: [".gitignore", "catalyst.*.prompt.md"]
      - name: prompts-ignore
        file-read: .github/prompts/.gitignore
      - if: ${{ get('prompts-ignore').trim() === '' }}
        then:
          - file-delete: .github/prompts/.gitignore
