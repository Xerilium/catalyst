# @req FR:cli-init/init.autonomy
name: setup-autonomy
description: Say whether full autonomy is on, list its risks when it is, and report config problems. Never turns it on.
owner: Engineer

# @req FR:cli-init/init.autonomy.no-enable
# This playbook only reads. Turning full autonomy on is a reviewed edit to .xe/config/catalyst.json.
steps:
  - var: config
    value: ${{ get('xe://config/catalyst.json') || '' }}

  - name: state
    script: |
      let autonomy;
      try { autonomy = JSON.parse(get('config') || '{}').autonomy; } catch { return 'unreadable'; }
      if (autonomy === undefined) return 'absent';
      return autonomy && autonomy.enabled === true ? 'on' : 'set';

  # @req FR:cli-init/init.autonomy.off
  - if: ${{ get('state') === 'absent' || get('state') === 'unreadable' }}
    then:
      - display: "\nFull autonomy: off. To let agents add Autopilot to their own clean PRs, see docs/autonomy.md in the Catalyst repo."
      - return: AutonomyOff

  # @req FR:cli-init/init.autonomy.validate
  # The check rule owns validation of the local file; its exit code is echoed so a bad config never fails init.
  # Agents read the merged config from GitHub, so a local edit takes effect only after it merges.
  - try:
      - name: status
        bash: |
          npx --no-install catalyst check --rules config.autonomy 2>&1
          echo "::exit $?"
      - name: report
        script: |
          const lines = String(get('status').stdout || '').trim().split(/\r?\n/);
          const exit = (lines.pop() || '').replace('::exit ', '').trim();
          // The rule reports at warning by default, so findings, not the exit code, decide
          const findings = lines.filter((l) => l.includes('config.autonomy'));
          return { ok: exit === '0' && findings.length === 0, text: (findings.length ? findings : lines).join('\n') };
      - if: ${{ !get('report').ok }}
        then:
          - display: "\n⚠️  Full autonomy config has problems, so autonomy is off:\n{{report.text}}"
    catch:
      - code: "*"
        steps:
          - display: "\n⚠️  Full autonomy: could not check the config ({{$error.message}}). Run `npx catalyst check --rules config.autonomy`."

  - if: ${{ get('state') !== 'on' || !(get('report') && get('report').ok) }}
    then:
      - display: "\nFull autonomy: off. See docs/autonomy.md in the Catalyst repo."

  # @req FR:cli-init/init.autonomy.risks
  - if: ${{ get('state') === 'on' && get('report') && get('report').ok }}
    then:
      - display: |

          Full autonomy: on (once this config is on the default branch).
          Full autonomy is on. Agents add Autopilot to their own clean PRs, and the Autopilot gates merge them.
          Risks to accept:
            - Code merges with no human review when no trigger fires. Code owners and branch rules still apply.
            - Triggers are heuristics. Widen escalate.paths for anything sensitive in this repo.
            - Budgets cap rounds, minutes, tokens, and PRs per day. Tokens are self-reported.
            - Halt everything: npx catalyst autonomy stop --all (writes a STOP file). Add Paused to hold one PR.
