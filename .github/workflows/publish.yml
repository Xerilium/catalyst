name: Publish to NPM

on:
  # Releases created with GITHUB_TOKEN never emit this event, so the release
  # workflow calls this one directly. Kept for releases cut by hand.
  release:
    types: [released]
  workflow_call:
    inputs:
      tag:
        description: 'Tag to publish (e.g., v0.1). If empty, uses latest release tag'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g., v0.1). If empty, uses latest release tag'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Determine tag and commit
        id: info
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            # Get latest release tag
            TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          fi

          # Get the commit that was tagged for release (one commit before the bump)
          # The release workflow creates two commits:
          # 1. "Release vX.Y" <- this is what we want to build from
          # 2. "Bump version to X.Y.Z-dev" <- current HEAD
          # The tag points to commit #1
          COMMIT=$(gh api /repos/${{ github.repository }}/git/ref/tags/$TAG --jq '.object.sha')

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "Publishing tag: $TAG from commit: $COMMIT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.info.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'
      - name: Verify version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Building and publishing version: $VERSION"
      - run: npm uninstall @xerilium/catalyst --save-dev || true
      - run: npm install
      - run: npm run build -- --skip-install
      # Two packages, two publishes. The CLI carries `bin` for `npx catalyst`
      # and the portable Agent Plugins payload; the plugin package carries the
      # Claude Code plugin and no `bin` at all.
      # @req FR:ai-plugin/plugin.publish
      - run: cd dist && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # The marketplace entry sources this package, so a release that skips it
      # leaves every plugin user on the previous version.
      # @req FR:ai-plugin/plugin.package
      # @req FR:ai-plugin/plugin.npm
      - run: cd dist-plugin && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify both packages are on npm at this version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for PKG in @xerilium/catalyst @xerilium/catalyst-plugin; do
            if ! npm view "$PKG@$VERSION" version > /dev/null 2>&1; then
              echo "::error::$PKG@$VERSION is not on npm after publishing"
              exit 1
            fi
            echo "$PKG@$VERSION published"
          done
