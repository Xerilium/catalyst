name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.1.0). If empty, uses current version from package.json'
        required: false
        type: string

jobs:
  # Fail fast: validate needs these, and it runs after the tag and version bump are pushed.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Require e2e secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          E2E_GH_TOKEN: ${{ secrets.E2E_GH_TOKEN }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] || [ -z "$E2E_GH_TOKEN" ]; then
            echo "::error::ANTHROPIC_API_KEY and E2E_GH_TOKEN are required for the release e2e"
            exit 1
          fi

  create-release:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Get current version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")

          # Use input version if provided, otherwise use current version from package.json
          if [ -n "${{ inputs.version }}" ]; then
            RELEASE_VERSION="${{ inputs.version }}"
          else
            RELEASE_VERSION=${VERSION%-dev}
          fi

          # Accept short versions (0.3) as full semver (0.3.0)
          if echo "$RELEASE_VERSION" | grep -qE '^[0-9]+\.[0-9]+$'; then
            RELEASE_VERSION="$RELEASE_VERSION.0"
          fi

          # Create tag version (strip .0 patch, but keep minor version)
          TAG_VERSION=$(echo $RELEASE_VERSION | sed -E 's/^([0-9]+\.[0-9]+)\.0$/\1/')

          NEXT_PATCH=$(echo $RELEASE_VERSION | awk -F. '{print $1"."$2"."($3+1)}')-dev

          # A rerun after a partial release reuses the existing tag instead of failing on it
          if git ls-remote --exit-code --tags origin "refs/tags/v$TAG_VERSION" > /dev/null 2>&1; then
            EXISTS=true
          else
            EXISTS=false
          fi
          echo "current=$VERSION" >> $GITHUB_OUTPUT
          echo "release=$RELEASE_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG_VERSION" >> $GITHUB_OUTPUT
          echo "next=$NEXT_PATCH" >> $GITHUB_OUTPUT
          echo "exists=$EXISTS" >> $GITHUB_OUTPUT
      - name: Configure git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
      - name: Update version to release version
        if: steps.version.outputs.exists != 'true'
        run: |
          npm version ${{ steps.version.outputs.release }} --no-git-tag-version --allow-same-version
      - name: Commit release version
        if: steps.version.outputs.exists != 'true'
        run: |
          git add package*.json
          git diff --cached --quiet || git commit -m "Release v${{ steps.version.outputs.tag }}"
          git push origin main
      - name: Create tag
        if: steps.version.outputs.exists != 'true'
        run: git tag v${{ steps.version.outputs.tag }}
      - name: Push tag
        if: steps.version.outputs.exists != 'true'
        run: git push origin v${{ steps.version.outputs.tag }}
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view v${{ steps.version.outputs.tag }} > /dev/null 2>&1; then
            gh release create v${{ steps.version.outputs.tag }} --title "Release v${{ steps.version.outputs.tag }}" --notes "Automated release for version ${{ steps.version.outputs.release }}." --draft
            gh release edit v${{ steps.version.outputs.tag }} --draft=false
          fi
      # Skip when main already moved past the release (rerun after the bump)
      - name: Update version to next dev
        id: bump
        run: |
          if [ "$(node -p "require('./package.json').version")" = "${{ steps.version.outputs.release }}" ]; then
            npm version ${{ steps.version.outputs.next }} --no-git-tag-version
            echo "needed=true" >> $GITHUB_OUTPUT
          else
            echo "Main is already past ${{ steps.version.outputs.release }}; no bump needed"
          fi
      - name: Reinstall latest build
        if: steps.bump.outputs.needed == 'true'
        run: |
          npm ci
          npm run build
      - name: Commit version bump
        if: steps.bump.outputs.needed == 'true'
        run: |
          git add package*.json
          git commit -m "Bump version to ${{ steps.version.outputs.next }}"
      - name: Push version bump
        if: steps.bump.outputs.needed == 'true'
        run: git push origin main

  # A release created with GITHUB_TOKEN emits no `release` event, so publishing
  # has to be chained here instead of waiting on a trigger that never fires.
  # @req FR:ai-plugin/plugin.npm
  # Required gate: the packed tarball must install and run before anything ships.
  # @req FR:e2e-gate/gate.local-build
  validate:
    needs: create-release
    permissions:
      contents: read
    uses: ./.github/workflows/validate-release.yml
    with:
      ref: v${{ needs.create-release.outputs.tag }}
      full: true
    secrets: inherit

  publish:
    needs: [create-release, validate]
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    uses: ./.github/workflows/publish.yml
    with:
      tag: v${{ needs.create-release.outputs.tag }}

  # Fails loudly if the version users now get from npm cannot run `catalyst check`.
  smoke:
    needs: [create-release, publish]
    permissions:
      contents: read
    uses: ./.github/workflows/validate-release.yml
    with:
      smoke: true
      version: ${{ needs.create-release.outputs.release }}

  # @req FR:ai-plugin/plugin.marketplace
  marketplace:
    needs: [create-release, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.create-release.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Publish marketplace listing
        env:
          AI_PLUGINS_TOKEN: ${{ secrets.AI_PLUGINS_TOKEN }}
        run: |
          if [ -z "$AI_PLUGINS_TOKEN" ]; then
            echo "::warning::AI_PLUGINS_TOKEN is not set; skipping the xerilium/ai-plugins marketplace update"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${AI_PLUGINS_TOKEN}@github.com/xerilium/ai-plugins.git" ../ai-plugins
          npx -y tsx scripts/generate-plugin.ts --marketplace ../ai-plugins/.claude-plugin/marketplace.json
          cd ../ai-plugins
          if git diff --quiet; then
            echo "Marketplace listing is up to date"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .claude-plugin/marketplace.json
          git commit -m "Update Catalyst listing for v${{ needs.create-release.outputs.tag }}"
          git push origin main
