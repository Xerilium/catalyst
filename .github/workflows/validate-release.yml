name: Validate release

# Validates the exact artifact users install: builds the publish tarball, installs
# it into a clean directory (never the repo), and runs `catalyst check` and
# `catalyst init` from that install. With `full`, also drives all 12 skills via
# scripts/e2e (needs ANTHROPIC_API_KEY and E2E_GH_TOKEN). With `smoke`, installs
# the already-published version from npm instead and runs `catalyst check`.
on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to validate (tag or commit). Empty = triggering ref'
        required: false
        type: string
      full:
        description: 'Also run all 12 skills'
        required: false
        type: boolean
        default: true
      smoke:
        description: 'Post-publish smoke: install the published version from npm instead of building'
        required: false
        type: boolean
        default: false
      version:
        description: 'Version for smoke mode (e.g., 0.3.3)'
        required: false
        type: string
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      E2E_GH_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to validate (tag or commit). Empty = triggering ref'
        required: false
        type: string
      full:
        description: 'Also run all 12 skills'
        required: false
        type: boolean
        default: false
      smoke:
        description: 'Post-publish smoke: install the published version from npm instead of building'
        required: false
        type: boolean
        default: false
      version:
        description: 'Version for smoke mode (e.g., 0.3.3)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    if: ${{ !inputs.smoke }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build -- --skip-install
      - name: Pack gate (tarball installed in a clean dir)
        run: npx tsx scripts/e2e/run.ts --pack-only
      - name: Install e2e tools
        if: ${{ inputs.full }}
        run: |
          npm install -g @anthropic-ai/claude-code pnpm
      - name: All 12 skills against the packed tarball
        if: ${{ inputs.full }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.E2E_GH_TOKEN }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] || [ -z "$GH_TOKEN" ]; then
            echo "::error::ANTHROPIC_API_KEY and E2E_GH_TOKEN are required for the full e2e"
            exit 1
          fi
          npx tsx scripts/e2e/run.ts
      - name: Upload e2e results
        if: ${{ always() && inputs.full }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e-results
          if-no-files-found: ignore

  smoke:
    if: ${{ inputs.smoke }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the published version and run catalyst check
        run: |
          set -e
          VERSION="${{ inputs.version }}"
          [ -n "$VERSION" ] || { echo "::error::version is required for smoke mode"; exit 1; }
          D=$(mktemp -d); cd "$D"; git init -q; npm init -y >/dev/null
          for i in $(seq 1 20); do
            npm install --no-audit --no-fund "@xerilium/catalyst@$VERSION" && break
            [ "$i" = 20 ] && { echo "::error::@xerilium/catalyst@$VERSION could not be installed from npm"; exit 1; }
            sleep 15
          done
          npx --no-install catalyst check || { echo "::error::catalyst check FAILED on published @xerilium/catalyst@$VERSION"; exit 1; }
          echo "published @xerilium/catalyst@$VERSION: catalyst check OK"
